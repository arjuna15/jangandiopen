<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada yang mau bilang...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(45deg) translateX(-100%); }
            100% { transform: rotate(45deg) translateX(100%); }
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 300;
        }

        .question {
            font-size: 1.4em;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }

        .btn-no {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
        }

        .btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(81, 207, 102, 0.6);
        }

        .btn-no:active {
            transform: scale(0.95);
        }

        .message {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            display: none;
        }

        .message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: #ff6b6b;
            animation: float 3s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-text {
            position: absolute;
            font-size: 14px;
            color: #ff6b6b;
            font-weight: bold;
            animation: floatText 2s ease-in-out;
            opacity: 0;
        }

        @keyframes floatText {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px) scale(1.5);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .question {
                font-size: 1.2em;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 Hai Sayanggg! 💖</h1>
        
        <p class="question">Aku punya pertanyaan nih...<br>Kamu Sayang Ngga sama Aku?</p>
        
        <div class="buttons">
            <button class="btn btn-no" onclick="handleNoClick()">Sayang banget 😊</button>
            <button class="btn btn-yes" id="btnYes" onmouseover="moveYesButton()">Ngga! 😠</button>
        </div>
        
        <div class="message" id="message">
            <h3>Yay! Aku tau kamu baik banget 💕</h3>
            <p>Makasih ya udah mau sama aku 😘</p>
        </div>
        
        <div class="hearts" id="hearts"></div>
    </div>

    <script>
        let yesClickCount = 0;
        const messages = [
            "Yakin gamau? 😢",
            "Beneran gamau? 💔",
            "Jangan dong sayang... 🥺",
            "Aku beliin telor gulung deh! 🙏",
            "Please mau dong 😭",
            "Aku sayang banget sama kamu! 💖"
        ];

        function moveYesButton() {
            if (yesClickCount < 3) {
                const btnYes = document.getElementById('btnYes');
                const container = document.querySelector('.container');
                const containerRect = container.getBoundingClientRect();
                const btnRect = btnYes.getBoundingClientRect();
                
                const maxX = containerRect.width - btnRect.width - 20;
                const maxY = containerRect.height - btnRect.height - 20;
                
                const randomX = Math.random() * maxX;
                const randomY = Math.random() * maxY;
                
                btnYes.style.position = 'absolute';
                btnYes.style.left = randomX + 'px';
                btnYes.style.top = randomY + 'px';
                
                // Tambah efek teks mengambang
                createFloatingText("Jangan klik aku! 😝", btnRect);
                
                yesClickCount++;
                
                if (yesClickCount < messages.length) {
                    btnYes.textContent = messages[yesClickCount];
                }
            }
        }

        function handleNoClick() {
            const message = document.getElementById('message');
            const hearts = document.getElementById('hearts');
            
            // Tampilkan pesan
            message.classList.add('show');
            
            // Buat efek hati
            createHearts();
            
            // Sembunyikan tombol
            document.querySelector('.buttons').style.display = 'none';
            
            // Tambah efek konfetti
            createConfetti();
        }

        function createFloatingText(text, position) {
            const floatingText = document.createElement('div');
            floatingText.className = 'floating-text';
            floatingText.textContent = text;
            floatingText.style.left = (position.left + position.width / 2) + 'px';
            floatingText.style.top = (position.top - 10) + 'px';
            
            document.querySelector('.container').appendChild(floatingText);
            
            setTimeout(() => {
                floatingText.remove();
            }, 2000);
        }

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#51cf66', '#ffd43b', '#339af0', '#cc5de8'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = '50%';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-20px';
                confetti.style.animation = `confettiFall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.opacity = '0.8';
                
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes confettiFall {
                        0% {
                            transform: translateY(0) rotate(0deg);
                            opacity: 1;
                        }
                        100% {
                            transform: translateY(500px) rotate(360deg);
                            opacity: 0;
                        }
                    }
                `;
                document.head.appendChild(style);
                
                container.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Efek ketik untuk judul
        document.addEventListener('DOMContentLoaded', function() {
            const title = document.querySelector('h1');
            const originalText = title.textContent;
            title.textContent = '';
            
            let i = 0;
            const typeWriter = () => {
                if (i < originalText.length) {
                    title.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 100);
                }
            };
            
            setTimeout(typeWriter, 1000);
        });
    </script>
</body>
</html>
